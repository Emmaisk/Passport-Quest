<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exploration HD-2D - Interplanétaire (RPG)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Georgia', serif; user-select: none; }
        
        #ui-layer {
            position: absolute; top: 20px; left: 20px; color: white;
            background: linear-gradient(135deg, rgba(20,15,10,0.95), rgba(0,0,0,0.8)); 
            padding: 15px 30px; border-radius: 8px; border: 2px solid #a67c00;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8); z-index: 10; transition: border-color 0.5s;
        }
        #planet-name { margin: 0 0 5px 0; text-transform: uppercase; letter-spacing: 3px; font-size: 1.3rem; transition: color 0.5s; text-shadow: 2px 2px 4px #000; }
        p { margin: 0; color: #ddd; font-size: 0.95rem; font-style: italic; }
        
        #interaction-hint {
            position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7); color: white; padding: 10px 20px;
            border-radius: 20px; font-size: 1rem; font-family: 'Segoe UI', sans-serif;
            display: none; box-shadow: 0 0 10px rgba(0,0,0,0.5); z-index: 15; text-align: center; border: 1px solid #fff;
        }

        #dialogue-box {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: linear-gradient(to bottom, #2b2b2b, #1a1a1a); color: white; padding: 20px 30px;
            border-radius: 8px; border: 2px solid #d4af37; font-size: 1.2rem;
            display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 20; width: 60%; max-width: 700px;
        }
        #dialogue-name { color: #d4af37; font-weight: bold; margin-bottom: 5px; font-size: 1.1rem; text-transform: uppercase; }

        #fade-screen {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: black; z-index: 100; opacity: 0; pointer-events: none;
            transition: opacity 1s ease-in-out;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-layer">
        <h2 id="planet-name" style="color: #e67e22;">Mars - Désert</h2>
        <p id="planet-desc">Trouvez votre vaisseau pour rentrer.</p>
        <p style="font-size: 0.8rem; margin-top: 15px; color: #aaa; font-family: 'Segoe UI';">Déplacement: Z Q S D | Saut: Espace | Interagir: E</p>
    </div>

    <div id="interaction-hint">Appuyez sur [E]</div>
    
    <div id="dialogue-box">
        <div id="dialogue-name">Nom</div>
        <div id="dialogue-text">Texte</div>
    </div>

    <div id="fade-screen"></div>

    <script>
        let scene, camera, renderer, player, spaceship, playerLight;
        let environmentGroup = new THREE.Group(); 
        
        // Ajout de 'space' pour le saut
        const keys = { z: false, q: false, s: false, d: false, e: false, space: false };
        let isMoving = false;
        let time = 0;
        let currentPlanet = 'mars'; 
        
        // Variables pour la physique du saut
        let velocityY = 0;
        const gravity = -0.015;
        const jumpStrength = 0.35;
        let isJumping = false;

        let npcs = [];
        let activeInteractable = null; 
        let isDialogueOpen = false;

        function createPixelTexture(artArray, palette) {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const pSize = 4;
            for(let y = 0; y < 16; y++) {
                for(let x = 0; x < 16; x++) {
                    const char = artArray[y][x];
                    if (char !== ' ') { ctx.fillStyle = palette[char]; ctx.fillRect(x * pSize, y * pSize, pSize, pSize); }
                }
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = THREE.NearestFilter;
            return tex;
        }

        function createCobblestoneTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#3a3a40'; ctx.fillRect(0,0,256,256);
            for(let i=0; i<400; i++) {
                ctx.fillStyle = Math.random()>0.5 ? '#4a4a50' : '#2a2a30';
                ctx.beginPath();
                ctx.arc(Math.random()*256, Math.random()*256, 3+Math.random()*5, 0, Math.PI*2);
                ctx.fill();
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(15, 15);
            return tex;
        }

        const characterArt = [
            "      BBBB      ",
            "    BHHHHHHB    ",
            "   BHH2222HHB   ",
            "  BH22EEEE22HB  ",
            "  BH22EWWV22HB  ",
            "  BH22EVVV22HB  ",
            "   BHH2222HHB   ",
            "   BBCCCCCCBB   ",
            "  B33BCCCCB33B  ",
            " B344BBCCBB443B ",
            " B344BCCCCB443B ",
            " BB33BCCCCB33BB ",
            "  BB B5555B BB  ",
            "     B5555B     ",
            "    B666666B    ",
            "    BBBBBBBB    "
        ];

        const playerPalette = { 'B':'#000', 'H':'#ECF0F1', '2':'#FFE0BD', 'E':'#00E5FF', 'W':'#FFF', 'V':'#0088AA', 'C':'#ECF0F1', '3':'#922B21', '4':'#E74C3C', '5':'#7F8C8D', '6':'#2C3E50' }; 
        
        function getNPCPalette(hair, clothes, pants) {
            return { 'B':'#111', 'H':hair, '2':'#FFDAB9', 'E':'#000', 'W':'#000', 'V':'#000', 'C':clothes, '3':clothes, '4':clothes, '5':pants, '6':'#333' };
        }

        function init() {
            scene = new THREE.Scene();
            scene.add(environmentGroup);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            // CORRECTION ECRAN NOIR : Placer la caméra en hauteur dès le départ
            camera.position.set(0, 10, 20); 
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            const playerTex = createPixelTexture(characterArt, playerPalette);
            player = new THREE.Sprite(new THREE.SpriteMaterial({ map: playerTex }));
            player.scale.set(2.5, 2.5, 1);
            // Position de base du joueur
            player.position.set(0, 1.15, 0); 
            scene.add(player);

            playerLight = new THREE.PointLight(0xffddaa, 0, 8); 
            scene.add(playerLight);

            window.addEventListener('keydown', (e) => { 
                const k = e.key.toLowerCase(); 
                if (keys.hasOwnProperty(k)) keys[k] = true; 
                if (e.key === ' ') keys.space = true; // Détection spécifique de l'espace
                
                if (k === 'e' && !e.repeat) {
                    if (isDialogueOpen) {
                        closeDialogue(); 
                    } else if (activeInteractable) {
                        if (activeInteractable.type === 'ship') travel();
                        if (activeInteractable.type === 'npc') openDialogue(activeInteractable.data);
                    }
                }
            });
            window.addEventListener('keyup', (e) => { 
                const k = e.key.toLowerCase(); 
                if (keys.hasOwnProperty(k)) keys[k] = false; 
                if (e.key === ' ') keys.space = false;
            });
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            buildMars(); 
            animate();
        }

        function createHouse(x, z, width, depth, height) {
            const group = new THREE.Group();
            
            const baseGeo = new THREE.BoxGeometry(width, height, depth);
            const baseMat = new THREE.MeshStandardMaterial({ color: 0xaa9988, roughness: 1 });
            const base = new THREE.Mesh(baseGeo, baseMat); 
            base.position.y = height/2; base.castShadow = true; base.receiveShadow = true;
            group.add(base);
            
            const roofGeo = new THREE.ConeGeometry(width*0.7, height*0.6, 4);
            const roofMat = new THREE.MeshStandardMaterial({ color: 0x5c2a21, roughness: 0.8 }); 
            const roof = new THREE.Mesh(roofGeo, roofMat); 
            roof.position.y = height + (height*0.6)/2; roof.rotation.y = Math.PI/4;
            roof.castShadow = true; 
            group.add(roof);

            const winLight = new THREE.PointLight(0xffaa33, 1, 15);
            winLight.position.set(0, height*0.4, depth/2 + 0.5);
            group.add(winLight);

            group.position.set(x, 0, z);
            return group;
        }

        function createStreetLamp(x, z) {
            const group = new THREE.Group();
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 4), new THREE.MeshStandardMaterial({ color: 0x222222 }));
            pole.position.y = 2; pole.castShadow = true; group.add(pole);
            
            const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.3), new THREE.MeshBasicMaterial({ color: 0xffcc77 }));
            bulb.position.y = 4.2; group.add(bulb);
            
            const light = new THREE.PointLight(0xffaa33, 1.5, 20); 
            light.position.y = 4.2; light.castShadow = true; group.add(light);
            
            group.position.set(x, 0, z);
            return group;
        }

        function createTree(x, z) {
            const group = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 3), new THREE.MeshStandardMaterial({ color: 0x4a2e00 }));
            trunk.position.y = 1.5; trunk.castShadow = true; group.add(trunk);
            
            const leaves = new THREE.Mesh(new THREE.SphereGeometry(2), new THREE.MeshStandardMaterial({ color: 0x2e5c1e, roughness: 0.9 }));
            leaves.position.y = 3.5; leaves.castShadow = true; group.add(leaves);
            
            group.position.set(x, 0, z);
            return group;
        }

        function createSpaceship(x, z) {
            const shipGroup = new THREE.Group();
            const body = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 2, 6, 16), new THREE.MeshStandardMaterial({ color: 0xaabbcc, metalness: 0.6 }));
            body.position.y = 3; body.castShadow = true; shipGroup.add(body);
            const nose = new THREE.Mesh(new THREE.ConeGeometry(1.5, 3, 16), new THREE.MeshStandardMaterial({ color: 0xd35400 }));
            nose.position.y = 7.5; nose.castShadow = true; shipGroup.add(nose);
            shipGroup.position.set(x, 0, z);
            return shipGroup;
        }

        function spawnNPC(name, text, startX, startZ, hairColor, clothesColor, pantsColor) {
            const tex = createPixelTexture(characterArt, getNPCPalette(hairColor, clothesColor, pantsColor));
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex }));
            sprite.scale.set(2.3, 2.3, 1);
            sprite.position.set(startX, 1.15, startZ);
            environmentGroup.add(sprite);

            npcs.push({
                mesh: sprite, name: name, text: text,
                spawn: { x: startX, z: startZ },
                target: { x: startX, z: startZ },
                timer: 0, isMoving: false
            });
        }

        function buildEarth() {
            clearEnvironment();
            scene.background = new THREE.Color(0x1a1a2e); 
            scene.fog = new THREE.FogExp2(0x1a1a2e, 0.02);
            playerLight.intensity = 0.5; 

            const ambient = new THREE.AmbientLight(0x404060, 0.8); // Légèrement augmenté pour éviter le noir total
            environmentGroup.add(ambient);

            const ground = new THREE.Mesh(new THREE.PlaneGeometry(150, 150), new THREE.MeshStandardMaterial({ map: createCobblestoneTexture(), roughness: 0.8 }));
            ground.rotation.x = -Math.PI/2; ground.receiveShadow = true;
            environmentGroup.add(ground);

            environmentGroup.add(createHouse(-15, -15, 8, 8, 6));
            environmentGroup.add(createHouse(15, -12, 10, 8, 7));
            environmentGroup.add(createHouse(-10, 18, 9, 9, 6));
            environmentGroup.add(createHouse(18, 15, 7, 7, 5));

            environmentGroup.add(createStreetLamp(-5, -5));
            environmentGroup.add(createStreetLamp(8, 6));
            environmentGroup.add(createTree(-12, -2));
            environmentGroup.add(createTree(12, -2));
            environmentGroup.add(createTree(-5, 12));

            spawnNPC("Emma", "La brise du soir est tellement agréable... Tu ne trouves pas ?", -4, 0, '#8e44ad', '#9b59b6', '#ecf0f1'); 
            spawnNPC("Serge", "J'ai passé la journée à réparer mon toit. Ces maisons anciennes demandent de l'entretien.", 5, -3, '#d35400', '#2980b9', '#34495e'); 
            spawnNPC("Kelly", "Oh, un astronaute ! Tu viens des étoiles ? Moi je n'ai jamais quitté ce village.", -3, 8, '#f1c40f', '#27ae60', '#bdc3c7'); 
            spawnNPC("Jessica", "Fais attention près de la lisière du village, il fait vite très sombre la nuit.", 7, 7, '#c0392b', '#111', '#111'); 

            spaceship = createSpaceship(0, 25);
            environmentGroup.add(spaceship);

            updateUI("Terre - Village d'Oakhaven", "#a67c00", "Parlez aux habitants ou retournez au vaisseau.");
        }

        function buildMars() {
            clearEnvironment();
            scene.background = new THREE.Color(0x2a0d05);
            scene.fog = new THREE.FogExp2(0x2a0d05, 0.02);
            playerLight.intensity = 0; 

            const ambient = new THREE.AmbientLight(0xffddbb, 0.6); // Augmenté pour sécuriser le rendu
            const sun = new THREE.DirectionalLight(0xff7700, 1.2);
            sun.position.set(-30, 20, -30); sun.castShadow = true;
            sun.shadow.camera.left = -50; sun.shadow.camera.right = 50; sun.shadow.camera.top = 50; sun.shadow.camera.bottom = -50;
            environmentGroup.add(ambient, sun);

            const groundGeo = new THREE.PlaneGeometry(150, 150, 60, 60);
            const pos = groundGeo.attributes.position;
            for (let i = 0; i < pos.count; i++) pos.setZ(i, Math.sin(pos.getX(i)*0.05) * Math.cos(pos.getY(i)*0.05) * 3);
            groundGeo.computeVertexNormals();
            const ground = new THREE.Mesh(groundGeo, new THREE.MeshStandardMaterial({ color: 0x933b22, roughness: 1 }));
            ground.rotation.x = -Math.PI/2; ground.receiveShadow = true;
            environmentGroup.add(ground);

            spaceship = createSpaceship(10, -10);
            environmentGroup.add(spaceship);

            updateUI("Mars - Désert Aride", "#e67e22", "Rejoignez votre vaisseau.");
        }

        function clearEnvironment() {
            while(environmentGroup.children.length > 0) environmentGroup.remove(environmentGroup.children[0]);
            npcs = [];
            spaceship = null;
        }

        function updateUI(name, color, desc) {
            document.getElementById('planet-name').innerText = name;
            document.getElementById('planet-name').style.color = color;
            document.getElementById('ui-layer').style.borderColor = color;
            document.getElementById('planet-desc').innerText = desc;
        }

        function travel() {
            const screen = document.getElementById('fade-screen');
            screen.style.opacity = '1';
            setTimeout(() => {
                if(currentPlanet === 'mars') { currentPlanet = 'terre'; buildEarth(); } 
                else { currentPlanet = 'mars'; buildMars(); }
                
                // Réinitialise la position du joueur et coupe le saut
                player.position.set(0, 10, 0); 
                velocityY = 0;
                isJumping = false;
                
                screen.style.opacity = '0';
            }, 1000);
        }

        function openDialogue(npcData) {
            isDialogueOpen = true;
            document.getElementById('dialogue-name').innerText = npcData.name;
            document.getElementById('dialogue-text').innerText = npcData.text;
            document.getElementById('dialogue-box').style.display = 'block';
            document.getElementById('interaction-hint').style.display = 'none';
        }

        function closeDialogue() {
            isDialogueOpen = false;
            document.getElementById('dialogue-box').style.display = 'none';
        }

        function getGroundHeight(x, z) {
            if(currentPlanet === 'terre') return 0;
            return Math.sin(x*0.05) * Math.cos(z*0.05) * 3;
        }

        function animate() {
            requestAnimationFrame(animate);
            time += 0.05;
            
            if (!isDialogueOpen) {
                // Déplacement au sol
                const speed = 0.25;
                isMoving = false;
                if (keys.z) { player.position.z -= speed; isMoving = true; }
                if (keys.s) { player.position.z += speed; isMoving = true; }
                if (keys.q) { player.position.x -= speed; isMoving = true; }
                if (keys.d) { player.position.x += speed; isMoving = true; }

                // LOGIQUE DU SAUT
                const groundY = getGroundHeight(player.position.x, player.position.z) + 1.15;
                
                if (keys.space && !isJumping) {
                    velocityY = jumpStrength;
                    isJumping = true;
                }

                // Application de la gravité
                velocityY += gravity;
                player.position.y += velocityY;

                // Collision avec le sol
                if (player.position.y <= groundY) {
                    // Animation de marche (sautillement) uniquement si on touche le sol
                    const walkBobbing = isMoving ? Math.abs(Math.sin(time * 6)) * 0.2 : 0;
                    player.position.y = groundY + walkBobbing;
                    velocityY = 0;
                    isJumping = false;
                }

                playerLight.position.copy(player.position);

                // IA des PNJ
                npcs.forEach(npc => {
                    npc.timer -= 1;
                    if (npc.timer <= 0) {
                        npc.target.x = npc.spawn.x + (Math.random() - 0.5) * 6;
                        npc.target.z = npc.spawn.z + (Math.random() - 0.5) * 6;
                        npc.timer = 100 + Math.random() * 200; 
                    }

                    const dx = npc.target.x - npc.mesh.position.x;
                    const dz = npc.target.z - npc.mesh.position.z;
                    const distToTarget = Math.sqrt(dx*dx + dz*dz);

                    if (distToTarget > 0.1) {
                        npc.mesh.position.x += (dx / distToTarget) * 0.03; 
                        npc.mesh.position.z += (dz / distToTarget) * 0.03;
                        npc.mesh.position.y = 1.15 + Math.abs(Math.sin(time * 4)) * 0.1; 
                    } else {
                        npc.mesh.position.y = 1.15; 
                    }
                });

                // Interactions
                let closestDist = 4; 
                activeInteractable = null;
                let hintText = "";

                if (spaceship && player.position.distanceTo(spaceship.position) < closestDist) {
                    activeInteractable = { type: 'ship' };
                    hintText = currentPlanet === 'mars' ? "Appuyez sur [E] pour voyager vers la Terre" : "Appuyez sur [E] pour retourner sur Mars";
                    closestDist = player.position.distanceTo(spaceship.position);
                }

                npcs.forEach(npc => {
                    const dist = player.position.distanceTo(npc.mesh.position);
                    if (dist < closestDist) {
                        activeInteractable = { type: 'npc', data: npc };
                        hintText = `Appuyez sur [E] pour parler à ${npc.name}`;
                        closestDist = dist;
                    }
                });

                const hintBox = document.getElementById('interaction-hint');
                if (activeInteractable) {
                    hintBox.innerText = hintText;
                    hintBox.style.display = 'block';
                } else {
                    hintBox.style.display = 'none';
                    closeDialogue(); 
                }
            }

            if (spaceship) spaceship.position.y = getGroundHeight(spaceship.position.x, spaceship.position.z);

            // Caméra : fluide et adaptée au saut
            const targetCamPos = new THREE.Vector3(player.position.x, player.position.y + 7, player.position.z + 14);
            camera.position.lerp(targetCamPos, 0.08);
            camera.lookAt(player.position.x, player.position.y, player.position.z);

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
