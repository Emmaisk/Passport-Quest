<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alien Escape</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #090d16;
    color: white;
    font-family: Arial, sans-serif;
  }
  #top {
    width: min(960px, 100%);
    margin: 14px auto 8px;
    padding: 0 12px;
  }
  h1 { margin: 0 0 5px; font-size: 21px; }
  #message { min-height: 22px; color: #d7e6ff; }
  #game {
    display: block;
    width: min(960px, 100%);
    height: auto;
    margin: auto;
    border: 2px solid #91a9ce;
    background: #111;
  }
  #help {
    width: min(960px, 100%);
    margin: 8px auto;
    padding: 0 12px;
    color: #c6cedb;
    font-size: 14px;
  }
</style>
</head>
<body>
  <div id="top">
    <h1>👽 Alien Escape</h1>
    <div id="message">Échappe-toi de la cave et rejoins ta soucoupe !</div>
  </div>

  <canvas id="game" width="960" height="600"></canvas>

  <div id="help">
    Déplacements : <b>ZQSD</b> ou <b>flèches</b> · Interaction : <b>E</b> · Recommencer : <b>R</b>
  </div>

<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const message = document.getElementById("message");

  const keys = {};
  let scene = 0;
  let won = false;
  let time = 0;

  const player = { x: 480, y: 480, r: 15, speed: 220 };
  const scientists = [
    { name: "Kelly", x: 360, y: 215, start: 360, end: 600, dir: 1, color: "#e89a83" },
    { name: "Jessica", x: 600, y: 300, start: 360, end: 600, dir: -1, color: "#d7a4e8" }
  ];

  function say(text) {
    message.textContent = text;
  }

  function reset() {
    scene = 0;
    won = false;
    player.x = 480;
    player.y = 480;
    say("Tu es enfermé dans une cave. Trouve la porte et appuie sur E.");
  }

  window.addEventListener("keydown", (event) => {
    const key = event.key.toLowerCase();
    keys[key] = true;
    if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(key)) {
      event.preventDefault();
    }
    if (key === "e") interact();
    if (key === "r") reset();
  });

  window.addEventListener("keyup", (event) => {
    keys[event.key.toLowerCase()] = false;
  });

  function near(x, y, distance = 65) {
    return Math.hypot(player.x - x, player.y - y) < distance;
  }

  function interact() {
    if (won) {
      reset();
      return;
    }

    if (scene === 0 && near(480, 95)) {
      scene = 1;
      player.x = 480;
      player.y = 520;
      say("À l’étage ! Kelly et Jessica discutent. Évite-les et rejoins la sortie.");
    } else if (scene === 1 && near(480, 95)) {
      scene = 2;
      player.x = 480;
      player.y = 520;
      say("Tu es dans la rue. Ta soucoupe t’attend au bout !");
    } else if (scene === 2 && near(480, 105)) {
      scene = 3;
      won = true;
      say("Évasion réussie ! Tu as retrouvé Mars. Appuie sur E ou R pour rejouer.");
    } else if (scene === 1) {
      say("La sortie est en haut de la pièce. Reste loin des scientifiques !");
    } else {
      say("Approche-toi de la sortie pour interagir.");
    }
  }

  function update(dt) {
    time += dt;
    if (won) return;

    let dx = 0, dy = 0;
    if (keys["arrowleft"] || keys["q"] || keys["a"]) dx--;
    if (keys["arrowright"] || keys["d"]) dx++;
    if (keys["arrowup"] || keys["z"] || keys["w"]) dy--;
    if (keys["arrowdown"] || keys["s"]) dy++;

    if (dx || dy) {
      const length = Math.hypot(dx, dy);
      player.x += (dx / length) * player.speed * dt;
      player.y += (dy / length) * player.speed * dt;
    }

    player.x = Math.max(28, Math.min(932, player.x));
    player.y = Math.max(45, Math.min(570, player.y));

    if (scene === 1) {
      for (const npc of scientists) {
        npc.x += npc.dir * 80 * dt;
        if (npc.x > npc.end || npc.x < npc.start) npc.dir *= -1;

        if (Math.hypot(player.x - npc.x, player.y - npc.y) < 34) {
          player.x = 480;
          player.y = 520;
          say("Oups ! Un scientifique t’a repéré. Réessaie discrètement.");
        }
      }
    }
  }

  function rect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
  }

  function text(value, x, y, size = 20, color = "white", align = "center") {
    ctx.fillStyle = color;
    ctx.font = `bold ${size}px Arial`;
    ctx.textAlign = align;
    ctx.fillText(value, x, y);
  }

  function drawPlayer() {
    // Ombre
    ctx.fillStyle = "#0008";
    ctx.beginPath();
    ctx.ellipse(player.x, player.y + 16, 18, 8, 0, 0, Math.PI * 2);
    ctx.fill();

    // Petit astronaute martien
    ctx.fillStyle = "#54d7a0";
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#d8fff0";
    ctx.beginPath();
    ctx.arc(player.x, player.y - 3, 8, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#182b36";
    ctx.fillRect(player.x - 7, player.y + 8, 14, 10);
    ctx.fillStyle = "#fff";
    ctx.font = "12px Arial";
    ctx.textAlign = "center";
    ctx.fillText("👽", player.x, player.y + 5);
  }

  function drawDoor(y, label) {
    rect(423, y - 36, 114, 54, "#30261f");
    rect(431, y - 30, 98, 45, "#a66b38");
    text(label, 480, y - 47, 16, "#fff2cf");
    text("E", 480, y - 2, 18, "white");
  }

  function drawCave() {
    rect(0, 0, 960, 600, "#292c32");
    // Sol en pierre
    for (let y = 0; y < 600; y += 55) {
      for (let x = 0; x < 960; x += 95) {
        rect(x + ((y / 55) % 2) * 25, y, 88, 48, (x + y) % 3 ? "#45474a" : "#3b3e43");
      }
    }

    // Lumière qui passe entre les barreaux
    const glow = ctx.createRadialGradient(480, 70, 10, 480, 70, 300);
    glow.addColorStop(0, "#fff3b866");
    glow.addColorStop(1, "#fff3b800");
    ctx.fillStyle = glow;
    ctx.fillRect(180, 0, 600, 380);

    rect(390, 0, 180, 20, "#16191e");
    for (let x = 395; x <= 565; x += 28) rect(x, 0, 7, 90, "#9a9b95");
    rect(390, 85, 180, 8, "#9a9b95");

    // Traces rouges décoratives
    ctx.strokeStyle = "#7f262c";
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.moveTo(170, 335); ctx.lineTo(230, 348); ctx.lineTo(280, 330);
    ctx.moveTo(720, 420); ctx.lineTo(780, 435); ctx.lineTo(820, 418);
    ctx.stroke();

    drawDoor(95, "ESCALIERS");
    text("CAVE — trouve la sortie", 480, 40, 22);
  }

  function drawLab() {
    rect(0, 0, 960, 600, "#b9c8c3");
    rect(0, 0, 960, 390, "#d6e2dc");
    rect(0, 390, 960, 210, "#52645e");

    // Carrelage
    ctx.strokeStyle = "#91a49c";
    ctx.lineWidth = 2;
    for (let x = 0; x < 960; x += 60) {
      ctx.beginPath(); ctx.moveTo(x, 390); ctx.lineTo(x, 600); ctx.stroke();
    }
    for (let y = 400; y < 600; y += 40) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(960, y); ctx.stroke();
    }

    // Fenêtres et bureau pour se cacher
    rect(80, 80, 180, 150, "#8ed5eb");
    rect(165, 80, 8, 150, "#edf7ec");
    rect(80, 150, 180, 8, "#edf7ec");
    rect(300, 355, 360, 55, "#754c31");
    rect(320, 410, 18, 100, "#432e23");
    rect(622, 410, 18, 100, "#432e23");
    text("BUREAU — cache-toi derrière !", 480, 348, 15, "#fff0d0");

    drawDoor(95, "SORTIE");
    text("LABORATOIRE", 480, 40, 22, "#20362e");

    // Scientifiques
    for (const npc of scientists) {
      ctx.fillStyle = npc.color;
      ctx.fillRect(npc.x - 13, npc.y - 5, 26, 35);
      ctx.fillStyle = "#efc7a5";
      ctx.beginPath();
      ctx.arc(npc.x, npc.y - 17, 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#f4f5f2";
      ctx.fillRect(npc.x - 17, npc.y - 4, 34, 38);
      text(npc.name, npc.x, npc.y - 38, 13, "#1b2522");
    }
  }

  function drawStreet() {
    rect(0, 0, 960, 600, "#11192b");
    // Lune
    ctx.fillStyle = "#ffe8a3";
    ctx.beginPath(); ctx.arc(790, 100, 42, 0, Math.PI * 2); ctx.fill();

    // Route
    rect(310, 0, 340, 600, "#343846");
    ctx.strokeStyle = "#e4dba2";
    ctx.setLineDash([28, 24]);
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(480, 0); ctx.lineTo(480, 600); ctx.stroke();
    ctx.setLineDash([]);

    // Maisons
    rect(25, 170, 230, 300, "#504253");
    rect(705, 170, 230, 300, "#35495a");
    for (const x of [60, 130, 200, 740, 810, 880]) {
      rect(x, 215, 38, 55, "#ffd77b");
      rect(x, 315, 38, 55, "#ffd77b");
    }

    // Soucoupe
    ctx.fillStyle = "#79d9ec";
    ctx.beginPath();
    ctx.ellipse(480, 155, 95, 27, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#c9fbff";
    ctx.beginPath();
    ctx.ellipse(480, 140, 40, 24, 0, Math.PI, Math.PI * 2);
    ctx.fill();
    text("SOUCOUPE — appuie sur E", 480, 95, 19, "#dbfbff");
  }

  function drawMars() {
    rect(0, 0, 960, 600, "#8f3828");
    ctx.fillStyle = "#c9673c";
    ctx.beginPath(); ctx.arc(770, 135, 90, 0, Math.PI * 2); ctx.fill();
    for (let i = 0; i < 14; i++) {
      const x = (i * 113 + 40) % 960;
      const y = 350 + (i * 37) % 220;
      ctx.fillStyle = i % 2 ? "#713326" : "#a64d32";
      ctx.beginPath();
      ctx.ellipse(x, y, 45, 18, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    text("BIENVENUE SUR MARS !", 480, 245, 38);
    text("Tu as réussi à t’échapper de la Terre 👽", 480, 295, 22);
    text("Appuie sur E ou R pour rejouer", 480, 340, 18, "#ffe2cc");
    drawPlayer();
  }

  function draw() {
    if (scene === 0) drawCave();
    if (scene === 1) drawLab();
    if (scene === 2) drawStreet();
    if (scene === 3) { drawMars(); return; }

    drawPlayer();

    // Indication d'interaction proche de la porte
    const doorY = scene === 2 ? 155 : 95;
    if (near(480, doorY, 85)) {
      text("APPUIE SUR E", 480, player.y - 32, 16, "#fff7b0");
    }

    if (scene === 1) {
      text("Évite Kelly et Jessica !", 480, 555, 17, "#fff");
    }
  }

  let lastTime = 0;
  function loop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000 || 0, 0.04);
    lastTime = timestamp;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
