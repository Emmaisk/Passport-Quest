<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Passport Quest</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eaf4ff;
            text-align: center;
            margin: 0;
        }

        h1 {
            background-color: #3b82f6;
            color: white;
            margin: 0;
            padding: 30px;
        }

        p {
            font-size: 18px;
        }

        .contenu {
            background-color: white;
            width: 70%;
            margin: 40px auto;
            padding: 30px;
            border-radius: 15px;
        }

        input {
            padding: 10px;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        button {
            padding: 10px 15px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background-color: #2563eb;
        }
    </style>
</head>

<body>

    <h1>🌍 Passport Quest</h1>

    <div class="contenu">

        <p>Découvre les pays du monde !</p>

        <input type="text" placeholder="Rechercher un pays">

        <button>Rechercher</button>

        <h2>🗺️ Carte du monde</h2>

        <p>La carte interactive sera bientôt disponible.</p>

    </div>

</body>

</html>
