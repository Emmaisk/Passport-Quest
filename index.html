<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Passport Quest</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f5f7fa;
            text-align: center;
            color: #222;
        }

        header {
            background-color: #2e6f5e;
            color: white;
            padding: 40px 20px;
        }

        h1 {
            font-size: 45px;
            margin-bottom: 10px;
        }

        .intro {
            font-size: 18px;
        }

        main {
            padding: 40px;
        }

        .search {
            margin-bottom: 30px;
        }

        input {
            padding: 12px;
            width: 250px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background-color: #2e6f5e;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #214f43;
        }

        .map {
            background-color: white;
            max-width: 800px;
            margin: auto;
            padding: 80px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .map h2 {
            font-size: 30px;
        }
    </style>
</head>

<body>

    <header>
        <h1>🌍 Passport Quest</h1>

        <p class="intro">
            Explore le monde, un pays à la fois.
        </p>
    </header>

    <main>

        <div class="search">

            <input
                type="text"
                placeholder="Rechercher un pays..."
            >

            <button>
                Rechercher
            </button>

        </div>

        <div class="map">

            <h2>🗺️ Carte du monde</h2>

            <p>
                La carte interactive apparaîtra bientôt ici !
            </p>

            <button>
                🎲 Découvrir un pays au hasard
            </button>

        </div>

    </main>

</body>

</html>
