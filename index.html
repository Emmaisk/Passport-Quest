<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exploration HD-2D - Interplanétaire</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; }
        
        #ui-layer {
            position: absolute; top: 20px; left: 20px; color: white;
            background: linear-gradient(135deg, rgba(10,10,20,0.95), rgba(0,0,0,0.8)); 
            padding: 15px 25px; border-radius: 12px; border: 1px solid #555;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6); z-index: 10; transition: border-color 0.5s;
        }
        #planet-name { margin: 0 0 5px 0; text-transform: uppercase; letter-spacing: 2px; font-size: 1.4rem; transition: color 0.5s; }
        p { margin: 0; color: #bdc3c7; font-size: 0.95rem; }
        
        #interaction-box {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9); color: white; padding: 15px 30px;
            border-radius: 30px; border: 2px solid #fff; font-size: 1.2rem; font-weight: bold;
            display: none; box-shadow: 0 0 20px rgba(255,255,255,0.3); z-index: 20; text-align: center;
        }

        #fade-screen {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: black; z-index: 100; opacity: 0; pointer-events: none;
            transition: opacity 1s ease-in-out;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-layer">
        <h2 id="planet-name" style="color: #e67e22;">Mars - Secteur 4</h2>
        <p id="planet-desc">Trouvez votre vaisseau pour voyager.</p>
        <p style="font-size: 0.8rem; margin-top: 15px; color: #7f8c8d;">Contrôles : Z Q S D | Action : E</p>
    </div>

    <div id="interaction-box">Appuyez sur [E] pour voyager vers la Terre</div>
    <div id="fade-screen"></div>

    <script>
        let scene, camera, renderer, player, spaceship, playerLight;
        let environmentGroup = new THREE.Group(); // Contient le décor de la planète actuelle
        
        const keys = { z: false, q: false, s: false, d: false, e: false };
        let isMoving = false;
        let time = 0;
        let currentPlanet = 'mars'; // 'mars' ou 'terre'
        let canInteractWithShip = false;

        // --- 1. PIXEL ART DÉTAILLÉ (16x16 Shading avancé) ---
        function createPixelTexture(artArray, palette) {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const pSize = 4;
            for(let y = 0; y < 16; y++) {
                for(let x = 0; x < 16; x++) {
                    const char = artArray[y][x];
                    if (char !== ' ') { ctx.fillStyle = palette[char]; ctx.fillRect(x * pSize, y * pSize, pSize, pSize); }
                }
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = THREE.NearestFilter;
            return tex;
        }

        // Astronaute beaucoup plus détaillé avec ombrages
        const playerArt = [
            "      BBBB      ",
            "    BB1111BB    ",
            "   B11222211B   ",
            "  B122CCCC221B  ",
            "  B122CWWV221B  ",
            "  B122CVVV221B  ",
            "   B11222211B   ",
            "   BB111111BB   ",
            "  B33B1111B33B  ",
            " B344BB11BB443B ",
            " B344B1111B443B ",
            " BB33B1111B33BB ",
            "  BB B1111B BB  ",
            "     B5555B     ",
            "    B566665B    ",
            "    BBBBBBBB    "
        ];
        // B: Contour, 1: Blanc cassé, 2: Gris ombre, C: Visière Cyan, W: Reflet visière, V: Ombre visière, 3: Sac rouge sombre, 4: Sac rouge vif, 5: Bottes grises, 6: Semelles sombres
        const playerPalette = { 'B':'#000', '1':'#ECF0F1', '2':'#BDC3C7', 'C':'#00E5FF', 'W':'#FFFFFF', 'V':'#0088AA', '3':'#922B21', '4':'#E74C3C', '5':'#7F8C8D', '6':'#2C3E50' };

        function init() {
            scene = new THREE.Scene();
            scene.add(environmentGroup);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // Création du joueur 2D
            const playerTex = createPixelTexture(playerArt, playerPalette);
            player = new THREE.Sprite(new THREE.SpriteMaterial({ map: playerTex }));
            player.scale.set(3, 3, 1);
            scene.add(player);

            playerLight = new THREE.PointLight(0xffffff, 0, 10); // S'allumera sur Terre
            scene.add(playerLight);

            // Events
            window.addEventListener('keydown', (e) => { 
                const k = e.key.toLowerCase(); if (keys.hasOwnProperty(k)) keys[k] = true; 
                if (k === 'e' && canInteractWithShip) travel();
            });
            window.addEventListener('keyup', (e) => { 
                const k = e.key.toLowerCase(); if (keys.hasOwnProperty(k)) keys[k] = false; 
            });
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            buildMars();
            animate();
        }

        // --- 2. VAISSEAU SPATIAL 3D ---
        function createSpaceship(x, z) {
            const shipGroup = new THREE.Group();
            
            // Corps métallique
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8, roughness: 0.2 });
            const body = new THREE.Mesh(new THREE.CylinderGeometry(1, 1.5, 6, 16), bodyMat);
            body.position.y = 4; body.castShadow = true;
            shipGroup.add(body);

            // Nez du vaisseau
            const noseMat = new THREE.MeshStandardMaterial({ color: 0xe74c3c, metalness: 0.5, roughness: 0.3 });
            const nose = new THREE.Mesh(new THREE.ConeGeometry(1, 3, 16), noseMat);
            nose.position.y = 8.5; nose.castShadow = true;
            shipGroup.add(nose);

            // Ailerons
            const finMat = new THREE.MeshStandardMaterial({ color: 0x34495e, metalness: 0.7, roughness: 0.2 });
            for(let i=0; i<4; i++) {
                const fin = new THREE.Mesh(new THREE.BoxGeometry(0.2, 3, 3), finMat);
                fin.position.y = 2.5;
                fin.rotation.y = (Math.PI / 2) * i;
                fin.position.x = Math.sin((Math.PI / 2) * i) * 1.5;
                fin.position.z = Math.cos((Math.PI / 2) * i) * 1.5;
                fin.castShadow = true;
                shipGroup.add(fin);
            }

            // Réacteur lumineux
            const glow = new THREE.PointLight(0x00ffff, 2, 10);
            glow.position.y = 0;
            shipGroup.add(glow);

            shipGroup.position.set(x, 0, z);
            return shipGroup;
        }

        // --- 3. GÉNÉRATEURS DE PLANÈTES ---
        function clearEnvironment() {
            while(environmentGroup.children.length > 0){ 
                environmentGroup.remove(environmentGroup.children[0]); 
            }
        }

        function buildMars() {
            clearEnvironment();
            scene.background = new THREE.Color(0x2a0d05);
            scene.fog = new THREE.FogExp2(0x2a0d05, 0.02);
            playerLight.intensity = 0; // Pas besoin de lampe de poche en plein jour

            const ambient = new THREE.AmbientLight(0xffddbb, 0.4);
            const sun = new THREE.DirectionalLight(0xff7700, 1.2);
            sun.position.set(-30, 20, -30); sun.castShadow = true;
            sun.shadow.camera.left = -50; sun.shadow.camera.right = 50; sun.shadow.camera.top = 50; sun.shadow.camera.bottom = -50;
            environmentGroup.add(ambient, sun);

            // Sable vallonné
            const groundGeo = new THREE.PlaneGeometry(200, 200, 80, 80);
            const pos = groundGeo.attributes.position;
            for (let i = 0; i < pos.count; i++) pos.setZ(i, Math.sin(pos.getX(i)*0.05) * Math.cos(pos.getY(i)*0.05) * 3);
            groundGeo.computeVertexNormals();
            const ground = new THREE.Mesh(groundGeo, new THREE.MeshStandardMaterial({ color: 0x933b22, roughness: 1 }));
            ground.rotation.x = -Math.PI/2; ground.receiveShadow = true;
            environmentGroup.add(ground);

            // Vaisseau
            spaceship = createSpaceship(10, -15);
            environmentGroup.add(spaceship);

            // UI
            document.getElementById('planet-name').innerText = "Mars - Secteur 4";
            document.getElementById('planet-name').style.color = "#e67e22";
            document.getElementById('ui-layer').style.borderColor = "#e67e22";
            document.getElementById('interaction-box').innerText = "Appuyez sur [E] pour voyager vers la Terre";
        }

        function buildEarth() {
            clearEnvironment();
            scene.background = new THREE.Color(0x050510); // Nuit noire cyberpunk
            scene.fog = new THREE.FogExp2(0x050510, 0.03);
            playerLight.intensity = 1.5; playerLight.color.setHex(0x00ffff); // Joueur éclaire en cyan

            const ambient = new THREE.AmbientLight(0x101030, 0.8);
            environmentGroup.add(ambient);

            // Sol sombre avec grille Néon (Synthwave)
            const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: 0x050510, roughness: 0.1, metalness: 0.8 }));
            ground.rotation.x = -Math.PI/2; ground.receiveShadow = true;
            environmentGroup.add(ground);

            const grid = new THREE.GridHelper(200, 100, 0xff00ff, 0x00ffff);
            grid.position.y = 0.05;
            grid.material.transparent = true; grid.material.opacity = 0.3;
            environmentGroup.add(grid);

            // Bâtiments Cyberpunk (Boîtes lumineuses)
            const bldgGeo = new THREE.BoxGeometry(1, 1, 1);
            for(let i = 0; i < 60; i++) {
                const height = 5 + Math.random() * 20;
                // Couleurs saturées aléatoires (Magenta, Cyan, Néon Vert)
                const colors = [0xff00ff, 0x00ffff, 0x39ff14, 0x9d00ff];
                const color = colors[Math.floor(Math.random() * colors.length)];
                
                const bldgMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9, roughness: 0.1 });
                const building = new THREE.Mesh(bldgGeo, bldgMat);
                building.scale.set(4 + Math.random()*4, height, 4 + Math.random()*4);
                
                // Ne pas poper sur le joueur ou le vaisseau
                let bx = (Math.random()-0.5)*150; let bz = (Math.random()-0.5)*150;
                if(Math.abs(bx) < 15 && Math.abs(bz) < 15) { bx += 20; bz += 20; }
                
                building.position.set(bx, height/2, bz);
                building.castShadow = true; building.receiveShadow = true;
                environmentGroup.add(building);

                // Arêtes lumineuses façon Néon
                const edges = new THREE.EdgesGeometry(bldgGeo);
                const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: color }));
                building.add(line); // Ajoute le néon au bâtiment

                // Ajouter des lumières saturées au hasard
                if(Math.random() > 0.7) {
                    const pointLight = new THREE.PointLight(color, 2, 30);
                    pointLight.position.set(bx, 2, bz + 5);
                    environmentGroup.add(pointLight);
                }
            }

            // Vaisseau
            spaceship = createSpaceship(-10, -10);
            environmentGroup.add(spaceship);

            // UI
            document.getElementById('planet-name').innerText = "Terre - Néo Cité";
            document.getElementById('planet-name').style.color = "#00ffff";
            document.getElementById('ui-layer').style.borderColor = "#00ffff";
            document.getElementById('interaction-box').innerText = "Appuyez sur [E] pour retourner sur Mars";
        }

        // --- 4. LOGIQUE DE JEU ---
        function travel() {
            const screen = document.getElementById('fade-screen');
            screen.style.opacity = '1';
            setTimeout(() => {
                if(currentPlanet === 'mars') {
                    currentPlanet = 'terre'; buildEarth();
                } else {
                    currentPlanet = 'mars'; buildMars();
                }
                player.position.set(0, 1.5, 0); // Reset position joueur
                screen.style.opacity = '0';
            }, 1000);
        }

        function getGroundHeight(x, z) {
            if(currentPlanet === 'terre') return 0; // Terre plate
            return Math.sin(x*0.05) * Math.cos(z*0.05) * 3; // Mars vallonnée
        }

        function animate() {
            requestAnimationFrame(animate);
            time += 0.1;
            const speed = 0.25;
            isMoving = false;

            if (keys.z) { player.position.z -= speed; isMoving = true; }
            if (keys.s) { player.position.z += speed; isMoving = true; }
            if (keys.q) { player.position.x -= speed; isMoving = true; }
            if (keys.d) { player.position.x += speed; isMoving = true; }

            const baseY = getGroundHeight(player.position.x, player.position.z) + 1.5;
            player.position.y = baseY + (isMoving ? Math.abs(Math.sin(time * 2)) * 0.3 : 0);
            playerLight.position.copy(player.position);

            // Ajustement hauteur Vaisseau
            if (spaceship) spaceship.position.y = getGroundHeight(spaceship.position.x, spaceship.position.z);

            // Interaction Vaisseau
            if (spaceship) {
                const dist = player.position.distanceTo(spaceship.position);
                const box = document.getElementById('interaction-box');
                if (dist < 7) {
                    box.style.display = 'block';
                    canInteractWithShip = true;
                } else {
                    box.style.display = 'none';
                    canInteractWithShip = false;
                }
            }

            // Caméra
            const targetCamPos = new THREE.Vector3(player.position.x, player.position.y + 6, player.position.z + 12);
            camera.position.lerp(targetCamPos, 0.1);
            camera.lookAt(player.position);

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
